# Pacchetti di installazione di CoverForge Studio per Linux (AppImage), Windows (installer) e macOS (dmg).
# Parte sulle PR che toccano il pacchetto e a mano (Actions → «Pacchetti di installazione» → Run workflow).
# A mano, indicando una versione (es. v2.1.0, uguale a quella di package.json), i pacchetti vengono allegati
# a una release di GitHub in bozza: la controlli e la pubblichi, e pubblicandola GitHub crea il tag.
name: Pacchetti di installazione

on:
  workflow_dispatch:
    inputs:
      versione:
        description: 'Versione da pubblicare, es. v2.1.0 (crea una release in bozza). Vuoto: solo i pacchetti.'
        required: false
        default: ''
  # anche sulle PR che toccano il pacchetto: così un errore di build si vede prima di unire
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - electron.js
      - server.js
      - start.js
      - scripts/**
      - assets/**
      - .github/workflows/pacchetti.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # i moduli nativi (better-sqlite3) vengono ricompilati per Electron; nessuna firma del codice
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # prova del pacchetto: il server parte con l'eseguibile dell'app e il database funziona
      - run: node scripts/smoke-packaged.js
      - uses: actions/upload-artifact@v4
        with:
          name: coverforge-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.versione != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # la versione deve essere quella del programma: v + "version" di package.json
      - name: Controllo della versione
        env:
          VERSIONE: ${{ inputs.versione }}
        run: |
          atteso="v$(node -p "require('./package.json').version")"
          if [ "$VERSIONE" != "$atteso" ]; then
            echo "::error::La versione indicata ($VERSIONE) non corrisponde a package.json ($atteso)."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          merge-multiple: true
      # bozza: il tag viene creato da GitHub quando la release viene pubblicata, sul commit di questa esecuzione
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versione }}
          target_commitish: ${{ github.sha }}
          name: CoverForge Studio ${{ inputs.versione }}
          draft: true
          generate_release_notes: true
          files: pacchetti/*
