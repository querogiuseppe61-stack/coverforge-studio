# Pacchetti di installazione di CoverForge Studio per Linux (AppImage), Windows (installer) e macOS (dmg).
# Si avvia a mano (Actions → «Pacchetti di installazione» → Run workflow), sulle PR che toccano il pacchetto,
# oppure pubblicando un tag v*: in quel caso i pacchetti vengono allegati a una release di GitHub in bozza,
# da controllare e pubblicare.
name: Pacchetti di installazione

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # anche sulle PR che toccano il pacchetto: così un errore di build si vede prima di unire
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - electron.js
      - server.js
      - start.js
      - assets/**
      - .github/workflows/pacchetti.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # i moduli nativi (better-sqlite3) vengono ricompilati per Electron; nessuna firma del codice
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: coverforge-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: pacchetti/*
